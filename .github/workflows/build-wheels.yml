name: Build wheels (no publish)

# Build-only sibling of release.yml. That workflow ends in a PyPI upload under the
# name `opentui`, which this fork does not own -- dispatching it to get wheels would
# fail at the one step that cannot be retried safely. Same matrix, same cibuildwheel
# settings, cp314 added, and it stops at the artifact upload.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x86_64
            runs-on: ubuntu-22.04
            cibw_archs: x86_64
          - os: linux-aarch64
            runs-on: ubuntu-24.04-arm
            cibw_archs: aarch64
          - os: macos-arm64
            runs-on: macos-14
            cibw_archs: arm64
          - os: macos-x86_64
            runs-on: macos-14
            cibw_archs: x86_64
          - os: windows-x86_64
            runs-on: windows-latest
            cibw_archs: AMD64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-manylinux_i686 *-musllinux_* cp314-macosx_arm64"
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs }}
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_archs }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.cibw_archs }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: "dnf install -y git && python {project}/scripts/download_opentui.py && cp {project}/src/opentui/opentui-libs/libopentui.so /usr/local/lib/ && ldconfig"
          CIBW_BEFORE_ALL_MACOS: "python {project}/scripts/download_opentui.py --force --arch ${{ matrix.cibw_archs }} && sudo mkdir -p /usr/local/lib && sudo cp {project}/src/opentui/opentui-libs/libopentui.dylib /usr/local/lib/"
          CIBW_BEFORE_ALL_WINDOWS: "python {project}/scripts/download_opentui.py --force && python {project}/scripts/generate_implib.py"
          CIBW_ENVIRONMENT_LINUX: "LD_LIBRARY_PATH={project}/src/opentui/opentui-libs"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=13.0"
          CIBW_ENVIRONMENT_WINDOWS: >
            PATH="{project}\\src\\opentui\\opentui-libs;$PATH"
          CIBW_TEST_REQUIRES: "pytest pytest-asyncio"
          CIBW_TEST_COMMAND: "pytest {project}/tests -v --tb=short -x"
          CIBW_TEST_SKIP: "*-macosx_x86_64"
          CIBW_ENVIRONMENT_PASS_LINUX: "GIT_TERMINAL_PROMPT"
          GIT_TERMINAL_PROMPT: "0"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          # cibuildwheel 4.x runs delvewheel by default; 2.22.0 did not, and the
          # package already carries opentui.dll itself, so the repair step only
          # fails looking for a library it is not meant to vendor.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
